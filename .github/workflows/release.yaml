name: Create Release
on:
  workflow_dispatch:
    inputs:
      nextVersion:
        description: "Release Version"
        required: true
        default: "0.0.0"

env:
  TRACKER_API_URL: ${{ vars.TRACKER_API_URL }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            binary: irminsul.exe
            features: ""
            out_file: irminsul-windows.exe
          - os: windows-latest
            name: windows-pcap
            binary: irminsul.exe
            features: "pcap"
            out_file: irminsul-windows-pcap.exe
          - os: ubuntu-22.04
            name: linux-x86_64
            binary: irminsul
            features: "pcap,static-libpcap"
            out_file: irminsul-linux-x86_64.tar.gz
          - os: macos-latest
            name: macos-arm64
            binary: irminsul
            features: "pcap"
            out_file: Irminsul-macos-arm64.app.tar.gz
    runs-on: ${{ matrix.os }}
  # Prepare the release commit by bumping the crate version.  This commit
  # is then saved as a git bundle artifact so that subsequent jobs can be
  # built on the correct revision.  The commit is not pushed to the repo
  # until the release builds have succeeded.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v5
        with:
          # Disable shallow cloning as creating git bundles from a shollow clone
          # is a relatively new feature.
          fetch-depth: 0
      - run: cargo install toml-cli
      - name: Update Cargo.toml version locally

      - name: Update Cargo.toml with new version
        # toml-cli does not support in place editing so the output is directed to
        # a temporary file to avoid updating the file as it's being read.
        run: |
          toml set Cargo.toml package.version ${{inputs.nextVersion}} > Cargo.toml.new
          rm Cargo.toml
          mv Cargo.toml.new Cargo.toml
          cargo generate-lockfile
      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure -f noninteractive man-db
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo apt-get update && sudo apt-get build-dep -y libpcap0.8 && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libatk1.0-dev
          cd /tmp
          [ ! -f libpcap-1.10.5.tar.gz ] && wget https://www.tcpdump.org/release/libpcap-1.10.5.tar.gz
          echo "37ced90a19a302a7f32e458224a00c365c117905c2cd35ac544b6880a81488f0  libpcap-1.10.5.tar.gz" | sha256sum -c
          tar xzf libpcap-1.10.5.tar.gz && cd libpcap-1.10.5
          ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu --disable-dbus
          make && sudo make install && sudo ldconfig
      - name: Setup Windows (for pcap builds)
        if: runner.os == 'Windows' && matrix.features == 'pcap'
        run: |
          curl https://npcap.com/dist/npcap-sdk-1.15.zip -o sdk.zip
          unzip sdk.zip
      - run: cargo build --release --no-default-features --features "${{ matrix.features }}"
        env:
          LIB: ${{ github.workspace }}/Lib/x64/
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/release
          mv ${{ matrix.binary }} ${{ matrix.out_file }}
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd target/release
          strip ${{ matrix.binary }} 2>/dev/null || true
          chmod +x ${{ matrix.binary }} 2>/dev/null || true
          tar -czf ${{ matrix.out_file }} ${{ matrix.binary }}
      - name: Package macOS app
        if: runner.os == 'macOS'
      - name: Commit version bump locally
        id: bump
        run: |
          version=${{ inputs.nextVersion }}
          mkdir -p Irminsul.app/Contents/{MacOS,Resources}
          sed "s/APPVERSION/$version/g" macos/Info.plist > Irminsul.app/Contents/Info.plist
          cp macos/AppIcon.icns Irminsul.app/Contents/Resources/
          cp macos/launcher Irminsul.app/Contents/MacOS/
          cp target/release/irminsul Irminsul.app/Contents/MacOS/
          chmod +x Irminsul.app/Contents/MacOS/{launcher,irminsul}
          tar -czf target/release/${{ matrix.out_file }} Irminsul.app
      - uses: actions/upload-artifact@v4
          git config user.name "irminsul bot"
          git config user.email "irminsul.bot@users.noreply.github.com"
          git add Cargo.toml
          git add Cargo.lock
          git commit -m "[skip ci] bump version to ${{inputs.nextVersion}}"

          # Record the version bump rev for use in building and tagging the
          # release.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bundle the version bump commit
        # A thin bundle holding just the bump commit, with the dispatch commit
        # as a prerequisite.  Every other job already has that from its own
        # checkout.
        run: git bundle create bump.bundle ${{ github.sha }}..HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: bump-bundle
          path: bump.bundle

  build-windows:
    runs-on: windows-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v5
      # Keep the cache keyed on the pre-bump Cargo.lock.  generate-lockfile
      # writes the new version into it, so keying on the bumped file would
      # miss the cache on every release.
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v7
        with:
          name: bump-bundle
      - name: Check out the version bump commit
        run: |
          git fetch bump.bundle HEAD:refs/heads/release-bump
          git checkout ${{ needs.prepare.outputs.sha }}
      - run: cargo build --release
      - name: Copy binary with platform suffix
        # irminsul-legacy-x64.exe exists purely to be the first asset in the
        # release.  Updaters up to 0.1.19 match assets against an empty target
        # string, which matches everything, so they install whichever asset
        # comes first.
        run: |
          cp target/release/irminsul.exe target/release/irminsul-windows-x64.exe
          cp target/release/irminsul.exe target/release/irminsul-legacy-x64.exe
      - uses: actions/upload-artifact@v6
        with:
          name: irminsul-windows
          path: |
            target/release/irminsul.exe
            target/release/irminsul-windows-x64.exe
            target/release/irminsul-legacy-x64.exe

  build-linux:
    # Pinned to 22.04 rather than ubuntu-latest to keep the glibc requirement
    # of the released binary as low as practical.
    runs-on: ubuntu-22.04
    needs: [prepare]
    steps:
      - uses: actions/checkout@v5
      # Keep the cache keyed on the pre-bump Cargo.lock.  generate-lockfile
      # writes the new version into it, so keying on the bumped file would
      # miss the cache on every release.
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/setup-libpcap
      - uses: actions/download-artifact@v7
        with:
          name: bump-bundle
      - name: Check out the version bump commit
        run: |
          git fetch bump.bundle HEAD:refs/heads/release-bump
          git checkout ${{ needs.prepare.outputs.sha }}
      - run: cargo build --release --features pcap,static-libpcap
      - name: Copy binary with platform suffix
        run: |
          cp target/release/irminsul target/release/irminsul-linux-x64
      - uses: actions/upload-artifact@v6
        with:
          name: irminsul-linux
          path: target/release/irminsul-linux-x64

  build-macos:
    runs-on: macos-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v5
      # Keep the cache keyed on the pre-bump Cargo.lock.  generate-lockfile
      # writes the new version into it, so keying on the bumped file would
      # miss the cache on every release.
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v7
        with:
          name: bump-bundle
      - name: Check out the version bump commit
        run: |
          git fetch bump.bundle HEAD:refs/heads/release-bump
          git checkout ${{ needs.prepare.outputs.sha }}
      - run: cargo build --release --features pcap
      - name: Copy binary with platform suffix
        run: cp target/release/irminsul target/release/irminsul-macos-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: irminsul-${{ matrix.name }}
          path: target/release/${{ matrix.out_file }}
          name: irminsul-macos
          path: target/release/irminsul-macos-arm64

  # Create the release:
  # * Push release commit to both main and the release tag
  # * Create a new github release on the release tag
  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    needs: [prepare, build-windows, build-linux, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo install toml-cli
      - name: Update version, commit, and tag
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: bump-bundle
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: irminsul-*
          merge-multiple: true
          path: ./
      - name: Push the version bump and tag the release
        run: |
          toml set Cargo.toml package.version ${{inputs.nextVersion}} > Cargo.toml.new
          rm Cargo.toml
          mv Cargo.toml.new Cargo.toml
          cargo generate-lockfile
          git config user.name "irminsul bot"
          git config user.email "irminsul.bot@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "[skip ci] bump version to ${{inputs.nextVersion}}"
          git tag v${{inputs.nextVersion}}
          git push origin main
          git push origin --tags
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          git fetch bump.bundle HEAD:refs/heads/release-bump
          git push origin ${{ needs.prepare.outputs.sha }}:main
          git tag v${{inputs.nextVersion}} ${{ needs.prepare.outputs.sha }}
          git push origin v${{inputs.nextVersion}}
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ inputs.nextVersion }}
          name: "v${{ inputs.nextVersion }}"
          artifacts: "artifacts/*/*"
          tag: v${{inputs.nextVersion}}
          name: "v${{inputs.nextVersion}}"
          commit: ${{ needs.prepare.outputs.sha }}
          artifacts: |
            irminsul-legacy-x64.exe
            irminsul-macos-arm64
            irminsul-windows-x64.exe
            irminsul.exe
            irminsul-linux-x64
